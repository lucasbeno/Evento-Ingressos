spring:
  application:
    name: EventoIngressosBackend

  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  ticketmaster:
    api-key: ${TICKETMASTER_API_KEY:}
    base-url: https://app.ticketmaster.com/discovery/v2
  ticket:
    qr-secret: ${TICKET_QR_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server:
  # Render (e a maioria dos PaaS) injeta a porta via a variável PORT, não
  # SERVER_PORT — aceita as duas, PORT tem prioridade.
  port: ${PORT:${SERVER_PORT:8080}}

logging:
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:info}
