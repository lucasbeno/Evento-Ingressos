services:
  - type: web
    name: evento-ingressos-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /events
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MINUTES
        value: "1440"
      - key: TICKET_QR_SECRET
        generateValue: true
      - key: TICKETMASTER_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
